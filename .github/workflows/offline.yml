name: Offline verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: LUMA_TEST_ADB="$ANDROID_HOME/platform-tools/adb" python3 -m unittest discover -s .agents/skills/verify-luma/scripts -v
      - run: python3 .agents/skills/verify-luma/scripts/verify.py offline --evidence "$RUNNER_TEMP/luma-offline"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-evidence
          path: ${{ runner.temp }}/luma-offline
