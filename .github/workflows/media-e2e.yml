name: media-e2e

# Runs tools/e2e/run.sh: Luma's Up Next card against the real Android TV Watch Next provider on an emulator.
on:
  pull_request:
    paths: [src/**, res/**, AndroidManifest.xml, build.sh, tools/e2e/**, .github/workflows/media-e2e.yml, .github/scripts/media-e2e.sh]
  push:
    branches: [main]
    paths: [src/**, res/**, AndroidManifest.xml, build.sh, tools/e2e/**, .github/workflows/media-e2e.yml, .github/scripts/media-e2e.sh]

permissions:
  contents: read

jobs:
  up-next:
    name: Up Next on the Android TV emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Android platform and build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"'
      - name: Build the signed test APKs
        run: bash tools/e2e/run.sh build
      # Emulator 37.1.11 (build 15917651) with 2048M RAM and a 128M heap is the setup that passes the whole suite
      # locally. Without these inputs the action takes the newest stable emulator and the emulator's 1024MB RAM floor.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          emulator-build: 15917651
          ram-size: 2048M
          heap-size: 128M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          pre-emulator-launch-script: adb start-server
          script: bash .github/scripts/media-e2e.sh
      - name: Upload guest crash evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: media-e2e-evidence
          path: |
            build/e2e/evidence
            build/e2e/result.txt
          if-no-files-found: warn
