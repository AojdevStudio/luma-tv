name: media-e2e

# Runs tools/e2e/run.sh: Luma's Up Next card against the real Android TV Watch Next provider on an emulator.
on:
  pull_request:
    paths: [src/**, res/**, AndroidManifest.xml, build.sh, tools/e2e/**, .github/workflows/media-e2e.yml]
  push:
    branches: [main]
    paths: [src/**, res/**, AndroidManifest.xml, build.sh, tools/e2e/**, .github/workflows/media-e2e.yml]

permissions:
  contents: read

jobs:
  up-next:
    name: Up Next on the Android TV emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the Android platform and build tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0" > /dev/null
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: LUMA_JDK="$JAVA_HOME" bash tools/e2e/run.sh
