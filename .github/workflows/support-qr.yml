name: Support QR codes
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - res/raw/support.txt
      - res/raw/about.txt
      - res/drawable-nodpi/qr_*.png
      - src/dev/luma/tv/MainActivity.java
      - tools/support-qr.sh
      - .github/workflows/support-qr.yml
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zbar-tools
      - run: tools/support-qr.sh --check
