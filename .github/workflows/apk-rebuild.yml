name: APK rebuild
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"'
      - run: ANDROID_SDK_ROOT="$ANDROID_HOME" LUMA_JDK="$JAVA_HOME" python3 tools/test_build.py
