name: upnext-refresh

on:
  pull_request:
    paths:
      - src/dev/luma/tv/UpNextWidget.java
      - src/dev/luma/tv/WidgetBoard.java
      - .agents/skills/verify-upnext-refresh/**
      - .github/workflows/upnext-refresh.yml
  push:
    branches: [main]
    paths:
      - src/dev/luma/tv/UpNextWidget.java
      - src/dev/luma/tv/WidgetBoard.java
      - .agents/skills/verify-upnext-refresh/**
      - .github/workflows/upnext-refresh.yml

permissions:
  contents: read

jobs:
  check:
    name: Up Next refresh ordering
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Refresh ordering checker with self-check
        run: java .agents/skills/verify-upnext-refresh/scripts/UpNextRefreshCheck.java --self-check

      - name: Reject invalid bounds with no result
        shell: bash
        run: |
          for args in "--refreshes -1" "--refreshes 0" "--writes 2x" "--writes"; do
            status=0
            java .agents/skills/verify-upnext-refresh/scripts/UpNextRefreshCheck.java $args || status=$?
            test "$status" -eq 2 || { echo "'$args' exited $status, expected 2 (no result)"; exit 1; }
          done

      - name: Replay the historical refresh and poster queue failures
        shell: bash
        run: |
          git show 11f1b1b2b5cd0cc37ab22172893694077f808d0e:src/dev/luma/tv/UpNextWidget.java > "$RUNNER_TEMP/UpNextWidget.java"
          status=0
          java .agents/skills/verify-upnext-refresh/scripts/UpNextRefreshCheck.java --source "$RUNNER_TEMP/UpNextWidget.java" > "$RUNNER_TEMP/refresh-history.log" || status=$?
          cat "$RUNNER_TEMP/refresh-history.log"
          test "$status" -eq 1
          for property in one_read_at_a_time never_shows_older newest_request_lands; do
            grep -Eq "^FAIL +${property}:" "$RUNNER_TEMP/refresh-history.log" || { echo "Restore the historical counterexample for $property"; exit 1; }
          done

          git show f6e4375d66d86ec01e67973058ec2da172139c2d:src/dev/luma/tv/UpNextWidget.java > "$RUNNER_TEMP/UpNextWidget.java"
          status=0
          java .agents/skills/verify-upnext-refresh/scripts/UpNextRefreshCheck.java --source "$RUNNER_TEMP/UpNextWidget.java" > "$RUNNER_TEMP/poster-queue.log" || status=$?
          cat "$RUNNER_TEMP/poster-queue.log"
          test "$status" -eq 1
          grep -Eq '^FAIL +pending_read_before_posters:' "$RUNNER_TEMP/poster-queue.log"
